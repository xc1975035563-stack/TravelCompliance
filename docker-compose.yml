services:
  app:
    build: .
    image: travel-compliance:${APP_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET: DEMO_ONLY_JWT_SECRET_NOT_FOR_PRODUCTION
      DEMO_PASSWORD: DemoOnly#2026
      AUTO_SEED: "1"
    volumes:
      - tc-data:/data

volumes:
  tc-data:
